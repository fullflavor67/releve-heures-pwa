<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevé d'heures</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<!-- iOS home screen -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Relevé d'heures">
<meta name="theme-color" content="#4CAF50">
</head>

<body>

<h2 id="date"></h2>

<label for="dayPicker">Choisir le jour :</label>
<input type="date" id="dayPicker">

<!-- MATIN -->
<div id="morning" class="section incomplete">
  <h3>🌅 Matin</h3>
  <div class="time-block">
    <label>Début</label>
    <div class="time-line">
      <select id="m_start_h"></select>
      <span>:</span>
      <select id="m_start_m"></select>
    </div>
  </div>

  <div class="time-block">
    <label>Fin</label>
    <div class="time-line">
      <select id="m_end_h"></select>
      <span>:</span>
      <select id="m_end_m"></select>
    </div>
  </div>

  <div id="m_decimal"></div>
  <button type="button" onclick="validateRow('morning')">Valider matin</button>
</div>

<!-- APRES-MIDI -->
<div id="afternoon" class="section incomplete">
  <h3>🌇 Après-midi</h3>
  <div class="time-block">
    <label>Début</label>
    <div class="time-line">
      <select id="a_start_h"></select>
      <span>:</span>
      <select id="a_start_m"></select>
    </div>
  </div>

  <div class="time-block">
    <label>Fin</label>
    <div class="time-line">
      <select id="a_end_h"></select>
      <span>:</span>
      <select id="a_end_m"></select>
    </div>
  </div>

  <div id="a_decimal"></div>
  <button type="button" onclick="validateRow('afternoon')">Valider après-midi</button>
</div>

<h3>📅 Vue semaine</h3>
<div id="weekView"></div>

<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .then(() => console.log("Service Worker installé ✅"))
    .catch((err) => console.log("Erreur SW :", err));
}
</script>

</body>
</html>
