<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevé d'heures</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<!-- iOS PWA -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Relevé d'heures">
<meta name="theme-color" content="#4CAF50">

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 10px;
}

.section {
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 15px;
}

.section h3 {
  margin-top: 0;
}

.time-block {
  margin-bottom: 8px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 4px;
}

select {
  font-size: 16px;
  padding: 4px;
}

button {
  margin-top: 8px;
  padding: 6px 12px;
  font-size: 16px;
}

.complete {
  background-color: #d4ffd4;
}

.incomplete {
  background-color: #ffd4d4;
}
</style>
</head>

<body>

<h2 id="date"></h2>

<label for="dayPicker">Choisir le jour :</label>
<input type="date" id="dayPicker">

<!-- MATIN -->
<div id="morning" class="section incomplete">
  <h3>🌅 Matin</h3>

  <div class="time-block">
    <label>Début</label>
    <select id="m_start_h"></select> :
    <select id="m_start_m"></select>
  </div>

  <div class="time-block">
    <label>Fin</label>
    <select id="m_end_h"></select> :
    <select id="m_end_m"></select>
  </div>

  <div id="m_decimal"></div>
  <button onclick="validateRow('morning')">Valider matin</button>
</div>

<!-- APRES-MIDI -->
<div id="afternoon" class="section incomplete">
  <h3>🌇 Après-midi</h3>

  <div class="time-block">
    <label>Début</label>
    <select id="a_start_h"></select> :
    <select id="a_start_m"></select>
  </div>

  <div class="time-block">
    <label>Fin</label>
    <select id="a_end_h"></select> :
    <select id="a_end_m"></select>
  </div>

  <div id="a_decimal"></div>
  <button onclick="validateRow('afternoon')">Valider après-midi</button>
</div>

<h3>📅 Vue semaine</h3>
<div id="weekView"></div>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
